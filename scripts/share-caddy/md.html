<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ .OriginalReq.URL.Path | html }}</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--mut:#59636e;--bd:#d1d9e0;--code:#f6f8fa;--link:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--bd:#3d444d;--code:#151b23;--link:#4493f8}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px;overflow-wrap:anywhere}
nav{color:var(--mut);font-size:14px;margin-bottom:16px}a{color:var(--link)}
code{background:var(--code);padding:.1em .3em;border-radius:4px;font-size:85%}
pre{background:var(--code);padding:12px;overflow:auto;border-radius:6px}pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}td,th{border:1px solid var(--bd);padding:6px 10px}
img{max-width:100%}
</style></head><body><main>
<nav><a href="./">← folder</a> · <a href="?raw=1">raw</a></nav>
{{ readFile .OriginalReq.URL.Path | markdown }}
</main></body></html>
