<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/20px sans-serif; color: #222; background: #fff; padding: 24px; }
main { display: flex; flex-direction: column; gap: 24px; width: 960px; }
.card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 12px; }
.row .label { align-self: flex-start; }
button { height: 32px; border: 1px solid #ccc; border-radius: 6px; background: #f4f4f4; font: inherit; padding: 0 12px; }
input { height: 32px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
select { height: 36px; border: 1px solid #ccc; border-radius: 2px; font: inherit; }
table { border-collapse: collapse; width: 100%; }
td { height: 40px; }
th.a { font-size: 12px; font-weight: 600; }
th.b { font-size: 14px; font-weight: 400; }
a { color: inherit; text-decoration: underline; }
p a { text-decoration: none; }
.odd { padding: 7px; }
.shifted { margin-left: 3px; }
.bar { display: flex; align-items: flex-start; height: 40px; gap: 8px; }
.bar button { margin-top: 8px; }
.kv { display: grid; grid-template-columns: 64px 1fr; width: 300px; }
.narrow { width: 160px; word-break: break-all; }
</style></head>
<body><main>
<p>Read the <a href="#guide">setup guide</a> first.</p>
<section class="card">
  <div class="row"><span>Alice</span><button>Disable</button></div>
  <div class="row"><span>Bob</span><button>Disable</button></div>
  <div class="row"><span class="label">Carol<br>You cannot disable<br>yourself</span><button>Disabled</button></div>
</section>
<section class="card shifted">
  <input value="alpha"><select><option>#general</option></select>
  <div class="odd">Status <span>!</span> <span>…</span></div>
  <button>New</button>
  <button><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/></svg></button>
</section>
<table><thead><tr><th class="a">Team</th></tr></thead><tbody><tr><td><a href="#a">Alpha</a></td></tr></tbody></table>
<table><thead><tr><th class="b">Event</th></tr></thead><tbody><tr><td>Deploy</td></tr></tbody></table>
<dl class="kv"><dt>App</dt><dd>A07FAKE</dd><dt>Event address</dt><dd>https://example.test/v1/events/agt_FAKE</dd></dl>
<div class="bar"><span>Notifications</span><button role="switch" aria-checked="true">On</button></div>
<div class="narrow"><span>https://example.test/a/very/long/hooks/events/endpoint/path</span></div>
</main></body></html>
